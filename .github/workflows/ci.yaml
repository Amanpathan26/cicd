
name: React Docker CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build React
        run: npm run build

      - name: Upload React artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/
          if-no-files-found: error

  docker-build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: react-ci-demo:${{ github.sha }}


      - name: Verify image exists
        run: docker image inspect react-ci-demo:${{ github.sha }}


      - name: Run container
        run: |
          docker run -d --name react-test -p 8080:80 react-ci-demo:${{ github.sha }}

          
      - name: Diagnose container on failure
        if: failure()
        run: |
          docker ps -a
          docker logs react-test || true
          docker inspect react-test --format '{{json .State}}' || true
      

      - name: Verify HTTP response
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8080/


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/react-ci-demo:${{ github.sha }}


      - name: Cleanup container
        if: always()
        run: docker rm -f react-test || true

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/react-ci-demo'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Trust EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/react-ci-demo:${IMAGE_TAG}"

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
              set -e

              echo "Pulling new image..."
              docker pull "$IMAGE"

              echo "Replacing old container..."
              docker rm -f react-ci-demo || true

              docker run -d \
                --name react-ci-demo \
                --restart unless-stopped \
                -p 8080:80 \
                "$IMAGE"

              echo "Checking application health..."
              for attempt in $(seq 1 15); do
                if curl --fail --silent http://localhost:8080/ > /dev/null; then
                  echo "Deployment successful!"
                  exit 0
                fi
                sleep 2
              done

              echo "Health check failed."
              docker logs react-ci-demo || true
              exit 1
          REMOTE