
name: React Docker CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build React
        run: npm run build

      - name: Upload React artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/
          if-no-files-found: error

  docker-build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: react-ci-demo:${{ github.sha }}


      - name: Verify image exists
        run: docker image inspect react-ci-demo:${{ github.sha }}


      - name: Run container
        run: |
          docker run -d --name react-test -p 8080:80 react-ci-demo:${{ github.sha }}

          
      - name: Diagnose container on failure
        if: failure()
        run: |
          docker ps -a
          docker logs react-test || true
          docker inspect react-test --format '{{json .State}}' || true
      

      - name: Verify HTTP response
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8080/


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/react-ci-demo:${{ github.sha }}


      - name: Cleanup container
        if: always()
        run: docker rm -f react-test || true
